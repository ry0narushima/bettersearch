<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="description" content="{{description}}">
<meta name="generator" content="{{generator}}">
<title>{{title}}</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --card: #ffffff;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-wash: rgba(42, 120, 214, 0.09);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warn: #fab219; --bad: #d03b3b; --none: #898781;
  --radius: 12px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --card: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #9c9a93;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-ink: #86b6ef;
    --accent-wash: rgba(57, 135, 229, 0.16);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 17px/1.65 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-ink); text-underline-offset: 0.15em; }
main { max-width: 760px; margin: 0 auto; padding: 56px 24px 80px; }
section { margin-top: 64px; }
h1, h2, h3 { line-height: 1.2; letter-spacing: -0.015em; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 44px); font-weight: 750; letter-spacing: -0.025em; }
h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
h3 { font-size: 19px; font-weight: 650; }
p { margin: 0 0 16px; }
.kicker {
  font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 14px;
}
.lede { color: var(--ink-2); margin-bottom: 24px; }

/* Hero */
.notice {
  font-size: 14px; color: var(--ink-2); background: var(--accent-wash);
  border-radius: 8px; padding: 10px 14px; margin-bottom: 28px;
}
.eyebrow { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); margin-bottom: 16px; }
.eyebrow .mode { color: var(--accent-ink); font-weight: 600; }
.question { font-size: 18px; color: var(--ink-2); margin: 16px 0 0; }
.tldr {
  margin: 28px 0 0; padding: 20px 22px; background: var(--card);
  border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: var(--radius);
  font-size: 20px; line-height: 1.5; font-weight: 500;
}
.tldr .label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 6px; }
.counts { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 22px; }
.count b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.count span { font-size: 13px; color: var(--muted); }

/* Takeaways */
.takeaways { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 12px; counter-reset: tk; }
.takeaways li {
  counter-increment: tk; position: relative; background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px 18px 62px;
}
.takeaways li::before {
  content: counter(tk); position: absolute; left: 18px; top: 17px; width: 28px; height: 28px;
  border-radius: 50%; background: var(--accent-wash); color: var(--accent-ink);
  font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center;
}

/* Citations */
.cite {
  display: inline-block; min-width: 1.6em; padding: 0 0.42em; margin-left: 2px;
  font-size: 0.7em; font-weight: 700; line-height: 1.6; text-align: center; vertical-align: 0.2em;
  border-radius: 999px; background: var(--accent-wash); color: var(--accent-ink); text-decoration: none;
}
.cite:hover, .cite:focus-visible { background: var(--accent); color: #fff; }
.cite.missing { background: transparent; color: var(--muted); }

/* Numbers */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 20px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
.stat .label { font-size: 14px; color: var(--ink-2); }
.stat .value { font-size: 34px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; margin: 6px 0 4px; }
.stat .value small { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-left: 3px; }
.stat .note { font-size: 13px; color: var(--muted); line-height: 1.45; }
.chart-card { margin: 16px 0 0; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 20px 14px; }
.chart-card h3 { margin-bottom: 2px; }
.chart-card .sub { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
.chart-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.chart { display: block; width: 100%; height: auto; min-width: 460px; font-family: var(--sans); }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.chart .lbl { fill: var(--ink-2); font-size: 13px; }
.chart .val { fill: var(--ink); font-size: 13px; font-weight: 600; }
.chart .big { fill: var(--ink); font-size: 26px; font-weight: 700; }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { stroke: var(--card); stroke-width: 2; }
.chart .hit { fill: transparent; }
.chart g.pt:hover .mark { opacity: 0.8; }
.chart g.pt:hover .hit { fill: var(--accent-wash); }
.chart .ring { fill: none; stroke: var(--card); stroke-width: 2; }
.f1 { fill: var(--s1); } .f2 { fill: var(--s2); } .f3 { fill: var(--s3); } .f4 { fill: var(--s4); }
.f5 { fill: var(--s5); } .f6 { fill: var(--s6); } .f7 { fill: var(--s7); } .f8 { fill: var(--s8); }
.k1 { stroke: var(--s1); } .k2 { stroke: var(--s2); } .k3 { stroke: var(--s3); } .k4 { stroke: var(--s4); }
.k5 { stroke: var(--s5); } .k6 { stroke: var(--s6); } .k7 { stroke: var(--s7); } .k8 { stroke: var(--s8); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; list-style: none; padding: 0; margin: 0 0 8px; font-size: 13px; color: var(--ink-2); }
.legend li { display: flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sw1 { background: var(--s1); } .sw2 { background: var(--s2); } .sw3 { background: var(--s3); } .sw4 { background: var(--s4); }
.sw5 { background: var(--s5); } .sw6 { background: var(--s6); } .sw7 { background: var(--s7); } .sw8 { background: var(--s8); }
.chart-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-size: 13px; color: var(--muted); margin-top: 8px; }
details.data summary { cursor: pointer; color: var(--accent-ink); }
details.data table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
details.data th, details.data td { text-align: left; padding: 3px 14px 3px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
details.data td.num { text-align: right; }

/* Sections */
.section h2 + p { margin-top: 12px; }
figure.img { margin: 24px 0; }
figure.img img { display: block; width: 100%; height: auto; border-radius: 10px; background: var(--grid); }
figure.img figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
figure.img .credit { white-space: nowrap; }

/* Confidence */
.legend-status { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--ink-2); margin: 12px 0 18px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font-size: 12px; font-weight: 650; color: var(--ink-2);
  border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px 1px 3px; background: var(--card);
}
.tag i {
  font-style: normal; width: 16px; height: 16px; border-radius: 50%; color: #fff;
  font-size: 10px; line-height: 16px; text-align: center; font-weight: 800;
}
.tag.verified i { background: var(--good); }
.tag.single i { background: var(--warn); color: #0b0b0b; }
.tag.conflicting i { background: var(--bad); }
.tag.unconfirmed i { background: var(--none); }
.claims { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--grid); }
.claims li { padding: 14px 0; border-bottom: 1px solid var(--grid); display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: start; }
.claims .note { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
.unconfirmed { padding-left: 20px; }
.unconfirmed li { margin-bottom: 10px; }
.unconfirmed .note { display: block; font-size: 14px; color: var(--muted); }

/* Sources */
.sources { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
.source {
  display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px;
  scroll-margin-top: 24px; transition: box-shadow 0.3s;
}
.source:target { box-shadow: 0 0 0 3px var(--accent); }
.icon {
  position: relative; width: 40px; height: 40px; border-radius: 10px; overflow: hidden;
  background: var(--accent-wash); color: var(--accent-ink); font-weight: 700; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
}
.icon img { position: absolute; inset: 8px; width: 24px; height: 24px; background: var(--card); border-radius: 4px; }
.source .num { font-size: 13px; font-weight: 700; color: var(--accent-ink); margin-right: 6px; }
.source .title { font-weight: 600; line-height: 1.4; word-break: break-word; }
.source .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--muted); margin-top: 4px; }
.badge { font-size: 12px; font-weight: 650; border-radius: 6px; padding: 0 7px; border: 1px solid var(--border); color: var(--ink-2); }
.badge.high { background: var(--accent-wash); color: var(--accent-ink); border-color: transparent; }

footer { margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--grid); font-size: 13px; color: var(--muted); }

@media (max-width: 560px) {
  body { font-size: 16px; }
  main { padding: 36px 18px 64px; }
  section { margin-top: 48px; }
  .tldr { font-size: 18px; }
  .takeaways li { padding: 16px 16px 16px 54px; }
  .takeaways li::before { left: 14px; }
}
@media print {
  body { background: #fff; }
  .chart-wrap { overflow: visible; }
  details.data { display: none; }
  a { color: inherit; }
}
</style>
</head>
<body>
<main>
{{content}}
</main>
</body>
</html>
