<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="description" content="{{description}}">
<meta name="generator" content="{{generator}}">
<title>{{title}}</title>
<style>
{{fonts}}
:root {
  color-scheme: light;
  /* Anthropic brand palette */
  --dark: #141413; --light: #faf9f5; --mid: #b0aea5; --pale: #e8e6dc;
  --orange: #d97757; --blue: #6a9bcc; --green: #788c5d;
  --page: var(--light);
  --panel: #f0eee6;
  --ink: var(--dark);
  --ink-2: #5e5d59;
  --rule: var(--pale);
  --grid: #e3e1d7;
  --axis: var(--mid);
  --accent: var(--orange);
  --accent-ink: #a9512f;
  --accent-wash: rgba(217, 119, 87, 0.14);
  --s1: var(--orange); --s2: var(--blue); --s3: var(--green); --s4: var(--mid);
  --s5: #a9512f; --s6: #3f6f9e; --s7: #55673f; --s8: #5e5d59;
  --good: var(--green); --single: var(--blue); --bad: var(--orange); --none: var(--mid);
  --serif: "Lora", Georgia, "Times New Roman", serif;
  --sans: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: var(--dark);
    --panel: #1f1e1d;
    --ink: var(--light);
    --ink-2: var(--mid);
    --rule: #33322f;
    --grid: #2c2b28;
    --axis: #55544f;
    --accent-ink: var(--orange);
    --accent-wash: rgba(217, 119, 87, 0.18);
    --s5: #e8a58c; --s6: #a3c2e0; --s7: #a7b78f; --s8: #d6d4cb;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 18px/1.7 var(--serif);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--accent-ink); text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
main { max-width: 728px; margin: 0 auto; padding: 72px 24px 96px; }
section { margin-top: 88px; }
h1, h2, h3 { font-family: var(--sans); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(34px, 6.4vw, 52px); font-weight: 600; line-height: 1.08; letter-spacing: -0.025em; }
h2 { font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -0.015em; margin-bottom: 20px; }
h3 { font-size: 17px; font-weight: 500; line-height: 1.35; letter-spacing: -0.005em; }
p { margin: 0 0 18px; }
strong { font-weight: 600; }
.kicker { font: 500 14px/1.4 var(--sans); color: var(--accent-ink); margin-bottom: 10px; }
.lede { color: var(--ink-2); margin-bottom: 28px; }

/* Hero: the answer is the headline act */
.notice {
  font-size: 15px; line-height: 1.6; font-style: italic; color: var(--ink-2);
  background: var(--panel); border-radius: 10px; padding: 14px 18px; margin: 0 0 48px;
}
.eyebrow {
  display: flex; flex-wrap: wrap; gap: 4px 20px;
  font: 400 14px/1.5 var(--sans); color: var(--ink-2); margin-bottom: 20px;
}
.eyebrow .mode { color: var(--accent-ink); font-weight: 500; }
.question { font-size: 20px; line-height: 1.55; font-style: italic; color: var(--ink-2); margin: 20px 0 0; max-width: 34em; }
.tldr { margin: 52px 0 0; font-size: clamp(22px, 3.4vw, 27px); line-height: 1.5; letter-spacing: -0.005em; }
.tldr .label { display: block; font: 500 14px/1.4 var(--sans); letter-spacing: 0; color: var(--accent-ink); margin-bottom: 10px; }
.counts { display: flex; flex-wrap: wrap; gap: 14px 0; margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--rule); }
.count { display: flex; align-items: baseline; gap: 7px; font-family: var(--sans); }
.count + .count::before {
  content: ""; align-self: center; width: 28px; height: 1px; margin: 0 14px 0 12px; background: var(--axis);
}
.count b { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.count span { font-size: 14px; color: var(--ink-2); }

/* Takeaways */
.takeaways { list-style: none; margin: 0; padding: 0; }
.takeaways li { position: relative; padding: 0 0 0 30px; margin: 0 0 18px; }
.takeaways li::before {
  content: ""; position: absolute; left: 2px; top: 0.66em; width: 9px; height: 9px; border-radius: 2px; background: var(--accent);
}

/* Citations */
.cite {
  display: inline-block; min-width: 1.55em; padding: 0 0.4em; margin-left: 3px;
  font: 600 0.62em/1.7 var(--sans); text-align: center; vertical-align: 0.28em;
  border-radius: 999px; background: var(--accent-wash); color: var(--accent-ink); text-decoration: none;
}
.cite + .cite { margin-left: 2px; }
.nw { white-space: nowrap; }
.cite:hover { background: var(--accent); color: var(--dark); }
.cite.missing { background: transparent; color: var(--ink-2); }

/* Numbers */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 40px; margin: 8px 0 24px; }
.stat { padding: 20px 0 22px; border-top: 1px solid var(--rule); }
.stat .label { font: 400 14px/1.45 var(--sans); color: var(--ink-2); }
.stat .value {
  font: 500 42px/1.1 var(--sans); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin: 8px 0 6px;
}
.stat .value small { font-size: 18px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-left: 3px; }
.stat .note { font-size: 15px; line-height: 1.5; color: var(--ink-2); }
.chart-card { margin: 20px 0 0; background: var(--panel); border-radius: 16px; padding: 26px 26px 18px; }
.chart-card h3 { margin-bottom: 2px; }
.chart-card .sub { font-size: 15px; font-style: italic; color: var(--ink-2); margin: 0 0 14px; }
.chart-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.chart { display: block; width: 100%; height: auto; min-width: 460px; font-family: var(--sans); }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .tick { fill: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.chart .lbl { fill: var(--ink-2); font-size: 13px; }
.chart .val { fill: var(--ink); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
.chart .big { fill: var(--ink); font-size: 26px; font-weight: 500; letter-spacing: -0.02em; }
.chart .line { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { stroke: var(--panel); stroke-width: 2; }
.chart .hit { fill: transparent; }
.chart g.pt:hover .mark { opacity: 0.82; }
.chart g.pt:hover .hit { fill: var(--accent-wash); }
.f1 { fill: var(--s1); } .f2 { fill: var(--s2); } .f3 { fill: var(--s3); } .f4 { fill: var(--s4); }
.f5 { fill: var(--s5); } .f6 { fill: var(--s6); } .f7 { fill: var(--s7); } .f8 { fill: var(--s8); }
.k1 { stroke: var(--s1); } .k2 { stroke: var(--s2); } .k3 { stroke: var(--s3); } .k4 { stroke: var(--s4); }
.k5 { stroke: var(--s5); } .k6 { stroke: var(--s6); } .k7 { stroke: var(--s7); } .k8 { stroke: var(--s8); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; list-style: none; padding: 0; margin: 0 0 8px; font: 400 13px/1.5 var(--sans); color: var(--ink-2); }
.legend li { display: flex; align-items: center; gap: 7px; }
.swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.sw1 { background: var(--s1); } .sw2 { background: var(--s2); } .sw3 { background: var(--s3); } .sw4 { background: var(--s4); }
.sw5 { background: var(--s5); } .sw6 { background: var(--s6); } .sw7 { background: var(--s7); } .sw8 { background: var(--s8); }
.chart-foot {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px;
  font-size: 14px; font-style: italic; color: var(--ink-2); margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--rule);
}
.chart-foot .cite { font-style: normal; }
details.data { font-style: normal; font-family: var(--sans); font-size: 13px; }
details.data summary { cursor: pointer; color: var(--accent-ink); font-weight: 500; border-radius: 3px; }
details.data table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
details.data th, details.data td { text-align: left; padding: 4px 16px 4px 0; border-bottom: 1px solid var(--rule); font-weight: 400; }
details.data th { color: var(--ink-2); }
details.data td.num { text-align: right; }

/* Sections */
figure.img { margin: 32px 0; }
figure.img img { display: block; width: 100%; height: auto; border-radius: 12px; background: var(--panel); }
figure.img figcaption { font-size: 15px; font-style: italic; color: var(--ink-2); margin-top: 10px; line-height: 1.55; }
figure.img .credit { white-space: nowrap; font-style: normal; font-family: var(--sans); font-size: 13px; margin-left: 4px; }

/* Confidence */
.legend-status { display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.5; color: var(--ink-2); margin: 0 0 24px; }
.legend-status > span { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.tag {
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  font: 500 13px/1.6 var(--sans); color: var(--ink);
}
.tag i {
  font-style: normal; width: 18px; height: 18px; border-radius: 50%; color: var(--dark);
  font-size: 10px; line-height: 18px; text-align: center; font-weight: 600; flex: none;
}
.tag.verified i { background: var(--good); color: var(--light); }
.tag.single i { background: var(--single); }
.tag.conflicting i { background: var(--bad); }
.tag.unconfirmed i { background: var(--none); }
.claims { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.claims li {
  padding: 16px 0 17px; border-bottom: 1px solid var(--rule);
  display: grid; grid-template-columns: 1fr 9.5em; gap: 4px 24px; align-items: baseline;
}
.claims .note { grid-column: 1 / -1; font-size: 15px; line-height: 1.55; font-style: italic; color: var(--ink-2); }
.unconfirmed { list-style: none; margin: 0; padding: 0; }
.unconfirmed li { position: relative; padding-left: 30px; margin-bottom: 16px; }
.unconfirmed li::before {
  content: ""; position: absolute; left: 1px; top: 0.55em; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--axis);
}
.unconfirmed .note { display: block; font-size: 15px; font-style: italic; color: var(--ink-2); }

/* Sources */
.sources { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.source {
  display: grid; grid-template-columns: 32px 1fr; gap: 14px; align-items: start;
  padding: 16px 0 17px; border-bottom: 1px solid var(--rule);
  scroll-margin-top: 32px; transition: background-color 0.6s ease, box-shadow 0.6s ease;
}
.source:target { background: var(--accent-wash); box-shadow: 0 0 0 10px var(--accent-wash); border-radius: 2px; }
.icon {
  position: relative; width: 32px; height: 32px; border-radius: 8px; overflow: hidden; margin-top: 2px;
  background: var(--panel); color: var(--ink-2); font: 500 14px/1 var(--sans);
  display: flex; align-items: center; justify-content: center;
}
.icon img { position: absolute; inset: 7px; width: 18px; height: 18px; background: var(--panel); border-radius: 3px; }
.source .num { font: 500 14px var(--sans); color: var(--accent-ink); margin-right: 8px; font-variant-numeric: tabular-nums; }
.source .title { font-size: 17px; line-height: 1.45; word-break: break-word; }
.source .title a { color: var(--ink); text-decoration-color: var(--axis); }
.source .title a:hover { text-decoration-color: var(--accent); }
.source .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font: 400 13px/1.5 var(--sans); color: var(--ink-2); margin-top: 5px; }
.badge { font-weight: 500; }
.badge.high { color: var(--accent-ink); }

footer { margin-top: 96px; padding-top: 22px; border-top: 1px solid var(--rule); font: 400 13px/1.6 var(--sans); color: var(--ink-2); }

@media (max-width: 560px) {
  body { font-size: 17px; }
  main { padding: 40px 20px 72px; }
  section { margin-top: 64px; }
  h2 { font-size: 24px; }
  .question { font-size: 18px; }
  .tldr { margin-top: 36px; }
  .counts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .count + .count::before { display: none; }
  .stats { grid-template-columns: 1fr; }
  .stat .value { font-size: 36px; }
  .chart-card { margin-left: -8px; margin-right: -8px; padding: 20px 16px 14px; border-radius: 12px; }
  .claims li { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
@media print {
  body { background: #fff; }
  main { padding-top: 0; }
  .chart-wrap { overflow: visible; }
  .chart-card, .stat, .claims li, .source { break-inside: avoid; }
  details.data { display: none; }
  a { color: inherit; }
}
</style>
</head>
<body>
<main>
{{content}}
</main>
</body>
</html>
